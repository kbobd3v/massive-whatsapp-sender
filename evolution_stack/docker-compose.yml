
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME}-postgres
    hostname: ${PROJECT_NAME}-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal-net

  redis:
    image: redis:6-alpine
    container_name: ${PROJECT_NAME}-redis
    hostname: redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal-net

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: ${PROJECT_NAME}-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${EVOLUTION_PORT}:8080"
    env_file:
      - .env
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - evolution_instances_data:/evolution/instances
    restart: unless-stopped
    networks:
      - internal-net

volumes:
  evolution_postgres_data:
    name: ${PROJECT_NAME}_postgres_data
  evolution_redis_data:
    name: ${PROJECT_NAME}_redis_data
  evolution_instances_data:
    name: ${PROJECT_NAME}_instances

networks:
  internal-net:
    name: ${PROJECT_NAME}-net
    driver: bridge